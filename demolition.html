<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142630"><title>拆楼专家 · Demolition Yard</title><link rel="stylesheet" href="demolition.css?v=0.1.1"></head><body>
<header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true">▥</span><div><h1 id="title">拆楼专家</h1><span id="subtitle">01 / 旧厂房试拆</span></div></div><span class="site-label" id="site-label">施工模拟 · DEMO</span><button id="language" aria-label="Switch language">EN</button></header>
<main class="workspace"><section id="yard-region" class="yard-panel" aria-label="拆除工地"><div class="mission-banner"><span class="mission-mark" aria-hidden="true">◎</span><p id="objective">正在准备工地…</p><span id="phase" class="phase">部署</span></div>
<div id="viewport" class="viewport"><canvas id="yard" width="960" height="640" tabindex="0" aria-label="拆除工地。点击可切断的结构支点布置工具。"></canvas><div class="canvas-key"><span><i class="key-target"></i><span id="key-target">拆除目标</span></span><span><i class="key-safe"></i><span id="key-safe">必须保护</span></span></div><div id="loading" class="loading">正在连接工地模拟…</div></div>
<div class="yard-footer"><span id="pointer-hint">点击支撑布置切断点。你决定何时触发。</span><span id="coordinates" aria-hidden="true"></span></div></section>
<aside class="control-panel"><section class="toolbox"><span class="eyebrow" id="tool-overline">布置工具</span><div class="tool-title"><span class="tool-icon" aria-hidden="true">✂</span><div><h2 id="tool-name">定点切断</h2><p id="inventory">— / —</p></div></div><p id="tool-description">点击支撑布置。选中已有点后，可以移动或移除。</p><div id="selection" class="selection"><strong id="selection-title">尚未选中切断点</strong><span id="selection-detail"></span><button id="remove" disabled>移除选中点</button><button id="deselect" disabled>取消选中</button></div><button id="trigger" class="trigger" disabled><span aria-hidden="true">▶</span> 开始拆除</button><div class="retry-row"><button id="retry">重试此方案</button><button id="clear">清空方案</button></div></section>
<section class="report" aria-live="polite"><span id="report-overline" class="eyebrow">现场记录</span><h2 id="report-title">先布置，再触发</h2><p id="report-text">不会因为点了建筑就立刻坍塌。</p><div class="metrics"><div><span id="metric-target-label">达标</span><strong id="metric-target">—</strong></div><div><span id="metric-protect-label">保护区</span><strong id="metric-protect">—</strong></div></div></section>
<details class="help"><summary id="help-title">怎么操作？</summary><p id="help-text">点击可切断的支撑放置工具；点已有工具可选择，再点新支撑移动。布置完成后按“开始拆除”。失败可以立刻重试，改动方案。</p></details><footer><span id="version">ONE YARD · v0.1.1</span><span id="offline">离线可玩 · 无进度依赖</span></footer></aside></main>
<script src="demolition-engine.js?v=0.1.1"></script><script src="demolition-ui.js?v=0.1.1"></script></body></html>
