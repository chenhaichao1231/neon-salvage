<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>怪奇实验室 · Strange Worlds</title><style>*{box-sizing:border-box}body{margin:0;background:#101725;color:#eef3ff;font:18px/1.6 system-ui;min-height:100vh;padding:clamp(24px,6vw,80px)}header{max-width:880px;margin-bottom:38px}small{color:#a4b8d6;letter-spacing:.16em}h1{font-size:clamp(32px,5vw,58px);line-height:1.15}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}a.card{display:block;border:1px solid #536080;border-radius:22px;padding:30px;text-decoration:none;color:inherit;background:linear-gradient(140deg,#263550,#172031);transition:transform .15s}a.card:hover,a.card:focus{transform:translateY(-6px);border-color:#bfe8d7;outline:2px solid #bfe8d7}b{font-size:24px}p{color:#c8d6ed}.mark{font-size:64px;color:#9ee6d2}.badge{font-size:14px;color:#bcebdc;display:block;margin:18px 0}footer{margin-top:35px;color:#9bacc5;font-size:14px}footer a{color:#bcebdc;margin-right:20px}button{float:right;background:#263550;border:1px solid #8b9cbb;border-radius:12px;color:white;font:inherit;padding:9px 16px;cursor:pointer}button:focus-visible{outline:3px solid #bcebdc}.notice{font-size:14px;max-width:800px}</style><header><button id="lang">EN</button><small>STRANGE WORLDS · PLAY / EXPERIMENT / DISCOVER</small><h1 id="heading"></h1><p id="intro"></p></header><main id="games"></main><footer><p id="save-note"></p><p id="version"></p><div id="legacy"><a href="space.html" id="old-space"></a><a href="hotel.html" id="old-hotel"></a><a href="demolition.html" id="old-demolition"></a></div></footer>
<script id="local-progress">
/* Local-only progress. No account, network, analytics, or access to other game saves. */
(function(root){'use strict';
 const KEY='three-worlds.progress.v1',GAMES=['world','cargo','bodies'];let memory={version:1,games:{}},persisted=true;
 function clean(raw){const out={version:1,games:{}};if(!raw||raw.version!==1||typeof raw.games!=='object'||!raw.games)return out;for(const game of GAMES){const source=raw.games[game];if(!source||typeof source!=='object')continue;const levels={};for(const [id,v] of Object.entries(source)){if(!/^\d+$/.test(id)||+id>99||!v||v.done!==true)continue;const item={done:true};for(const key of ['moves','seconds'])if(Number.isFinite(v[key])&&v[key]>=0)item[key]=v[key];levels[id]=item;}out.games[game]=levels;}return out;}
 function read(){try{const value=root.localStorage?.getItem(KEY);if(value){const stored=clean(JSON.parse(value));for(const game of GAMES){const levels=memory.games[game]||(memory.games[game]={});for(const [id,item]of Object.entries(stored.games[game]||{})){const current=levels[id]||{},merged={...item,...current,done:true};for(const key of ['moves','seconds'])if(Number.isFinite(item[key])&&Number.isFinite(current[key]))merged[key]=Math.min(item[key],current[key]);levels[id]=merged;}}}}catch(_){persisted=false;}return clean(memory);}
 function complete(game,level,result={}){if(!GAMES.includes(game)||!Number.isInteger(level)||level<0||level>99)return false;memory=read();const levels=memory.games[game]||(memory.games[game]={});const prev=levels[level]||{},next={...prev,done:true};for(const key of ['moves','seconds'])if(Number.isFinite(result[key])&&result[key]>=0)next[key]=Number.isFinite(prev[key])?Math.min(prev[key],result[key]):result[key];if(JSON.stringify(prev)===JSON.stringify(next))return true;levels[level]=next;try{if(!root.localStorage)throw Error('Storage unavailable');root.localStorage.setItem(KEY,JSON.stringify(memory));persisted=true;}catch(_){persisted=false;}return true;}
 function status(){return {progress:read(),persisted};}
 root.TrialProgress={complete,status,key:KEY};if(typeof module==='object'&&module.exports)module.exports=root.TrialProgress;
})(globalThis);

</script>
<script id="gallery-ui">
(()=>{let language='zh';try{language=localStorage.getItem('three-worlds.language')||'zh'}catch(_){}const $=id=>document.getElementById(id),games=[{id:'world',icon:'↻',name:['世界坏掉了','World Out of Order'],copy:['改写重力、墙壁和摩擦，找出规则之间的漏洞。','Rewrite gravity, walls and friction. Find the loopholes between rules.']},{id:'cargo',icon:'◈',name:['不正常的快递','Odd Cargo'],copy:['有的货物怕黑，有的害羞。先理解它，再送它回家。','Some parcels fear darkness. Others are shy. Understand them, then deliver them.']},{id:'bodies',icon:'⇄',name:['借来的身体','Borrowed Bodies'],copy:['一个意识，三种能力。把身体留在最需要它的地方。','One mind, three abilities. Leave each body where it can help most.']}];function render(){const en=language==='en',t=(a,b)=>en?b:a;document.documentElement.lang=en?'en':'zh-CN';$('lang').textContent=en?'中文':'EN';$('heading').textContent=t('同一个世界，换一种可能。','One world. Another possibility.');$('intro').textContent=t('选择一种玩法，直接开始。随时换一款，不需要重刷或升级。','Choose a game and start. Switch whenever you like. No grinding or upgrades required.');const status=globalThis.TrialProgress?.status(),saved=status?.progress?.games||{};$('games').innerHTML=games.map(g=>{const count=Object.values(saved[g.id]||{}).filter(v=>v.done).length;return `<a class="card" href="${g.id}.html"><div class="mark">${g.icon}</div><b>${g.name[en?1:0]}</b><p>${g.copy[en?1:0]}</p><span class="badge">${t('已完成','Completed')}: ${count} · ${t('全部关卡可直接选择','All levels freely selectable')}</span><span>${t('进入世界','Enter world')} →</span></a>`}).join('');$('save-note').textContent=status?.persisted===false?t('浏览器不允许保存：本页只记住本次进度，不影响游玩。','Browser storage is unavailable: progress lasts only for this session. Play is unaffected.'):t('完成记录保存在当前浏览器。下载版与在线版可能使用不同存档空间，不自动同步；旧游戏存档不变。','Completion is saved in this browser. Downloaded and online versions may use separate storage and do not sync. Previous game saves stay untouched.');$('version').textContent=t('v0.3.0 · 三个世界，各六关','v0.3.0 · Three worlds, six levels each');$('old-space').textContent=t('旧版：余烬航线','Archive: Neon Salvage');$('old-hotel').textContent=t('旧版：第七夜旅馆','Archive: Seventh Night Hotel');$('old-demolition').textContent=t('旧版：拆楼专家','Archive: Demolition Expert');} $('lang').onclick=()=>{language=language==='zh'?'en':'zh';try{localStorage.setItem('three-worlds.language',language)}catch(_){}render();};window.addEventListener('pageshow',render);render();})();
</script></html>
