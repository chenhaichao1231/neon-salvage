<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c38"><title>校园防线 · Campus Defense</title><link rel="stylesheet" href="td-lanes.css"></head>
<body><main class="app">
<header><div><span class="eyebrow">AI CAMPUS / DEMO 0.1 · 临时素材 / PLACEHOLDER ART</span><h1 id="title">校园防线</h1></div><div class="resources"><strong id="gpu">GPU —</strong><span id="core"></span><span id="wave"></span></div><button id="language" aria-label="Switch language">EN</button></header>
<section class="command"><p id="goal" role="status" aria-live="polite"></p><div class="commands"><button id="start" class="primary"></button><button id="pause"></button><button id="speed"></button><button id="retry"></button></div></section>
<section id="arena" aria-label="五行校园防线"><div id="board"><canvas id="scene" aria-hidden="true"></canvas><div id="grid" role="group" aria-label="部署格"></div><div id="tokens" aria-label="GPU补给"></div><div id="row-preview" aria-hidden="true"></div></div></section>
<section class="selection"><div id="cards" role="group" aria-label="选择角色"></div><p id="unit-description"></p><div id="selected-unit"><span id="unit-summary"></span><button id="refund"></button></div></section>
<footer><details id="forecast"><summary id="forecast-title"></summary><p id="fiction-note"></p><div id="forecast-content"></div></details><span id="art-note"></span></footer>
</main><script src="td-lanes.js"></script><script src="td-lanes-ui.js"></script></body></html>
