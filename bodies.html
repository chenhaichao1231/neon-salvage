/* Local-only progress. No account, network, analytics, or access to other game saves. */
(function(root){'use strict';
 const KEY='three-worlds.progress.v1',GAMES=['world','cargo','bodies'];let memory={version:1,games:{}},persisted=true;
 function clean(raw){const out={version:1,games:{}};if(!raw||raw.version!==1||typeof raw.games!=='object'||!raw.games)return out;for(const game of GAMES){const source=raw.games[game];if(!source||typeof source!=='object')continue;const levels={};for(const [id,v] of Object.entries(source)){if(!/^\d+$/.test(id)||+id>99||!v||v.done!==true)continue;const item={done:true};for(const key of ['moves','seconds'])if(Number.isFinite(v[key])&&v[key]>=0)item[key]=v[key];levels[id]=item;}out.games[game]=levels;}return out;}
 function read(){try{const value=root.localStorage?.getItem(KEY);if(value){const stored=clean(JSON.parse(value));for(const game of GAMES){const levels=memory.games[game]||(memory.games[game]={});for(const [id,item]of Object.entries(stored.games[game]||{})){const current=levels[id]||{},merged={...item,...current,done:true};for(const key of ['moves','seconds'])if(Number.isFinite(item[key])&&Number.isFinite(current[key]))merged[key]=Math.min(item[key],current[key]);levels[id]=merged;}}}}catch(_){persisted=false;}return clean(memory);}
 function complete(game,level,result={}){if(!GAMES.includes(game)||!Number.isInteger(level)||level<0||level>99)return false;memory=read();const levels=memory.games[game]||(memory.games[game]={});const prev=levels[level]||{},next={...prev,done:true};for(const key of ['moves','seconds'])if(Number.isFinite(result[key])&&result[key]>=0)next[key]=Number.isFinite(prev[key])?Math.min(prev[key],result[key]):result[key];if(JSON.stringify(prev)===JSON.stringify(next))return true;levels[level]=next;try{if(!root.localStorage)throw Error('Storage unavailable');root.localStorage.setItem(KEY,JSON.stringify(memory));persisted=true;}catch(_){persisted=false;}return true;}
 function status(){return {progress:read(),persisted};}
 root.TrialProgress={complete,status,key:KEY};if(typeof module==='object'&&module.exports)module.exports=root.TrialProgress;
})(globalThis);

</script>

function fresh(i=0){return {level:i,selected:0,bodies:LEVELS[i].start.map(p=>p.slice()),crates:LEVELS[i].crates.map(p=>p.slice()),battery:LEVELS[i].battery?.slice()||null,carrying:false,signal:false,terminal:false,won:false,moves:0};}

function tile(s,p){return LEVELS[s.level].map[p[1]]?.[p[0]]||'#';}
function weightAt(s,p){return [s.bodies[1],...s.crates].some(b=>same(b,p));}

 if(action.type!=='move')return {s:state,msg:'blocked',changed:false};const d=action.d,p=s.bodies[s.selected],q=[p[0]+d[0],p[1]+d[1]],t=tile(s,q);if(t==='#')return {s:state,msg:'wall',changed:false};if(t==='V'&&s.selected!==2)return {s:state,msg:'vent',changed:false};if(t==='B'&&s.selected!==2&&!bridgeOpen(s,q))return {s:state,msg:s.level===5?'bridgeBoth':'bridgeOff',changed:false};if(t==='G'&&!gate(s))return {s:state,msg:'gate',changed:false};if(s.bodies.some((b,i)=>i!==s.selected&&same(b,q)))return {s:state,msg:'occupied',changed:false};const ci=s.crates.findIndex(c=>same(c,q));if(ci>=0){if(s.selected!==1)return {s:state,msg:'crate',changed:false};const r=[q[0]+d[0],q[1]+d[1]],rt=tile(s,r);if(rt==='#'||rt==='V'||rt==='G'&&!gate(s)||s.bodies.some(b=>same(b,r))||s.crates.some(c=>same(c,r)))return {s:state,msg:'push',changed:false};s.crates[ci]=r;}
 s.bodies[s.selected]=q;if(LEVELS[s.level].bridges?.some(b=>bridgeOpen(state,b.p)&&!bridgeOpen(s,b.p)&&[...s.bodies,...s.crates].some(body=>same(body,b.p))))return {s:state,msg:'bridgeOccupied',changed:false};s.moves++;if(s.selected===0&&t==='E'){if(s.terminal){s.won=true;return {s,msg:'win',changed:true};}return {s,msg:'exit',changed:true};}return {s,msg:t==='T'?'atTerminal':t==='S'?'atSignal':t==='P'?'atPlate':'moved',changed:true};}

function batteryGoal(s){if(s.level===5)return finalGoal(s);if(s.won)return ['出口已到达，可选关重试另一种方案。','Exit reached. Select a level to try another plan.'];if(s.terminal)return ['下一步：让人类走到出口。','Next: take the human to the exit.'];const stage=s.level===4&&s.bodies[0][0]>4?1:0,link=LEVELS[s.level].bridges[stage];if(s.bodies[0][0]<link.p[0]){if(!bridgeOpen(s,link.p)){if(s.carrying)return ['下一步：无人机把电池带到标号 '+(stage+1)+' 插座，按「放下电池」。','Next: carry the battery to socket '+(stage+1)+' and press Dock battery.'];return ['下一步：切换无人机，走到电池上按「拿起电池」。','Next: switch to the drone, stand on the battery and press Take battery.'];}return ['下一步：切换人类，走过亮起的桥，到另一侧实地。','Next: take the human across the lit bridge onto solid ground.'];}if(s.bodies[0][0]===link.p[0])return ['下一步：人类再向右一步，先离开桥面，别急着拔电。','Next: move the human one step right off the bridge before removing power.'];if(!plate(s))return ['下一步：重型机体走上承重板，为终端供电。','Next: move the heavy body onto the plate to power the terminal.'];return ['下一步：人类走到终端并操作，再去出口。','Next: activate the terminal with the human, then reach the exit.'];}

 let svg='<defs><pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 14L14 0" stroke="#8bb6b5" stroke-opacity=".045"/></pattern></defs>';

}
$('moreHelp').onclick=()=>{hintLevel=Math.min(2,hintLevel+1);render();};$('levelSelect').onchange=e=>{state=fresh(+e.target.value);history=[];hintLevel=0;$('helpPanel').open=false;message='welcome';render();};$('bodies').onclick=e=>{const b=e.target.closest('[data-body]');if(b)dispatch({type:'select',id:+b.dataset.body});};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>dispatch({type:'move',d:b.dataset.dir.split(',').map(Number)}));$('use').onclick=()=>dispatch({type:'use'});$('undo').onclick=()=>{if(history.length){state=history.pop();message='undo';render();}};$('reset').onclick=()=>{state=fresh(state.level);history=[];hintLevel=0;$('helpPanel').open=false;message='reset';render();};$('next').onclick=()=>{if(state.won){state=fresh((state.level+1)%LEVELS.length);history=[];hintLevel=0;$('helpPanel').open=false;message='welcome';render();}};$('lang').onclick=()=>{language=1-language;render();};$('world').onclick=e=>{const svg=$('world'),point=svg.createSVGPoint();point.x=e.clientX;point.y=e.clientY;const local=point.matrixTransform(svg.getScreenCTM().inverse()),x=Math.floor(local.x/70),y=Math.floor(local.y/70),id=state.bodies.findIndex(p=>same(p,[x,y]));if(id>=0)return dispatch({type:'select',id});const p=state.bodies[state.selected],d=[x-p[0],y-p[1]];if(Math.abs(d[0])+Math.abs(d[1])===1)dispatch({type:'move',d});else{message='far';render();}};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;const dirs={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(dirs[e.key]){e.preventDefault();dispatch({type:'move',d:dirs[e.key]});}else if(['1','2','3'].includes(e.key))dispatch({type:'select',id:+e.key-1});else if(e.key===' '){e.preventDefault();dispatch({type:'use'});}});render();
