<script id="local-progress">
/* Local-only progress. No account, network, analytics, or access to other game saves. */
(function(root){'use strict';
 const KEY='three-worlds.progress.v1',GAMES=['world','cargo','bodies'];let memory={version:1,games:{}},persisted=true;
 function clean(raw){const out={version:1,games:{}};if(!raw||raw.version!==1||typeof raw.games!=='object'||!raw.games)return out;for(const game of GAMES){const source=raw.games[game];if(!source||typeof source!=='object')continue;const levels={};for(const [id,v] of Object.entries(source)){if(!/^\d+$/.test(id)||+id>99||!v||v.done!==true)continue;const item={done:true};for(const key of ['moves','seconds'])if(Number.isFinite(v[key])&&v[key]>=0)item[key]=v[key];levels[id]=item;}out.games[game]=levels;}return out;}
 function read(){try{const value=root.localStorage?.getItem(KEY);if(value){const stored=clean(JSON.parse(value));for(const game of GAMES){const levels=memory.games[game]||(memory.games[game]={});for(const [id,item]of Object.entries(stored.games[game]||{})){const current=levels[id]||{},merged={...item,...current,done:true};for(const key of ['moves','seconds'])if(Number.isFinite(item[key])&&Number.isFinite(current[key]))merged[key]=Math.min(item[key],current[key]);levels[id]=merged;}}}}catch(_){persisted=false;}return clean(memory);}
 function complete(game,level,result={}){if(!GAMES.includes(game)||!Number.isInteger(level)||level<0||level>99)return false;memory=read();const levels=memory.games[game]||(memory.games[game]={});const prev=levels[level]||{},next={...prev,done:true};for(const key of ['moves','seconds'])if(Number.isFinite(result[key])&&result[key]>=0)next[key]=Number.isFinite(prev[key])?Math.min(prev[key],result[key]):result[key];if(JSON.stringify(prev)===JSON.stringify(next))return true;levels[level]=next;try{if(!root.localStorage)throw Error('Storage unavailable');root.localStorage.setItem(KEY,JSON.stringify(memory));persisted=true;}catch(_){persisted=false;}return true;}
 function status(){return {progress:read(),persisted};}
 root.TrialProgress={complete,status,key:KEY};if(typeof module==='object'&&module.exports)module.exports=root.TrialProgress;
})(globalThis);

</script>
<script id="cargo-core">
(function(root){'use strict';const W=900,H=520;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function create(level=0){if(![0,1,2,3,4,5].includes(level))throw Error('Unknown delivery');const state={level,phase:'ready',time:0,cargo:{x:level===0?100:100,y:level===0?350:level===1?330:300,r:19,vx:0,vy:0},magnet:{x:115,y:220},target:{x:800,y:level===0?165:level===1?330:300,r:44},lights:[{x:100,y:350,r:96},{x:330,y:155,r:90},{x:550,y:350,r:92},{x:800,y:165,r:100}],walls:level===0?[{x:235,y:282,w:85,h:150},{x:465,y:55,w:85,h:150}]:level===2?[{x:280,y:80,w:34,h:310},{x:565,y:215,w:34,h:305}]:[],health:100,watched:false,drag:false,pointer:null,blocked:false,reason:null,delivered:0};if(level===3){state.cargo.x=140;state.cargo.y=410;state.twin={x:760,y:410,r:19};state.target={x:140,y:125,r:42};state.twinTarget={x:760,y:125,r:42};state.walls=[{x:90,y:260,w:180,h:28},{x:680,y:175,w:170,h:28}];state.hazard={x:410,y:110,w:80,h:360};state.dragSide=1;}if(level===4){state.cargo.r=38;state.cargo.x=90;state.cargo.y=320;state.target={x:810,y:230,r:44};state.walls=[{x:300,y:80,w:30,h:180},{x:300,y:400,w:30,h:120},{x:560,y:80,w:30,h:60},{x:560,y:280,w:30,h:240}];}if(level===5){state.cargo={x:90,y:330,r:38,vx:0,vy:0};state.target={x:810,y:230,r:44};state.lights=[{x:100,y:330,r:125},{x:340,y:190,r:105},{x:580,y:350,r:105},{x:810,y:230,r:115}];}return state;}
function begin(s){if(s.phase==='ready'){s.phase='playing';return true;}return false;}
function input(s,type,x,y){if(type==='release'){s.drag=false;s.watched=false;s.pointer=null;return;}if(s.phase!=='playing')return;if(s.level===1||s.level>=4){if(type==='down')s.watched=true;return;}if(!Number.isFinite(x)||!Number.isFinite(y))return;const p={x:clamp(x,22,W-22),y:clamp(y,22,H-22)};if(type==='down'&&s.level===3){if(dist(s.cargo,p)<=72||dist(s.twin,p)<=72){s.dragSide=dist(s.cargo,p)<=dist(s.twin,p)?1:-1;s.drag=true;s.pointer=p;}return;}if(type==='down'){if(s.level===2||dist(s.cargo,p)<=72){s.drag=true;s.pointer=p;}}else if(type==='move'&&s.drag)s.pointer=p;}
function gateOpen(s,index){const phase=(s.time+(index===1?2:0))%4;return phase<1.6;}
function moveCargo(s,dx,dy){const c=s.cargo;s.blocked=false;const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/8));for(let i=0;i<steps;i++){c.x=clamp(c.x+dx/steps,c.r,W-c.r);for(const r of s.walls)if(c.x+c.r>r.x&&c.x-c.r<r.x+r.w&&c.y+c.r>r.y&&c.y-c.r<r.y+r.h){c.x=dx>0?r.x-c.r:r.x+r.w+c.r;c.vx=0;s.blocked=true;}c.y=clamp(c.y+dy/steps,c.r,H-c.r);for(const r of s.walls)if(c.x+c.r>r.x&&c.x-c.r<r.x+r.w&&c.y+c.r>r.y&&c.y-c.r<r.y+r.h){c.y=dy>0?r.y-c.r:r.y+r.h+c.r;c.vy=0;s.blocked=true;}}}
function overlaps(c,r){return c.x+c.r>r.x&&c.x-c.r<r.x+r.w&&c.y+c.r>r.y&&c.y-c.r<r.y+r.h;}
function mirrorMove(s,dx,dy){const c=s.cargo;const safe=(x,y)=>!s.walls.some(r=>overlaps({x,y,r:c.r},r)||overlaps({x:W-x,y,r:c.r},r));s.blocked=false;const nx=clamp(c.x+dx,c.r,W-c.r);if(safe(nx,c.y))c.x=nx;else s.blocked=true;const ny=clamp(c.y+dy,c.r,H-c.r);if(safe(c.x,ny))c.y=ny;else s.blocked=true;s.twin.x=W-c.x;s.twin.y=c.y;}
function tick(s,dt){s.time+=dt;const c=s.cargo;if(s.level===0){if(s.drag&&s.pointer){const dx=s.pointer.x-c.x,dy=s.pointer.y-c.y,d=Math.hypot(dx,dy),travel=Math.min(d,210*dt);if(d>0)moveCargo(s,dx/d*travel,dy/d*travel);}const light=s.lights.some(l=>dist(l,c)<l.r);s.health=clamp(s.health+(light?65:-42)*dt,0,100);if(s.health<=0){s.phase='lost';s.reason='dark';}}
if(s.level===1){if(!s.watched)moveCargo(s,95*dt,0);for(let i=0;i<2;i++){const x=i===0?345:610;if(!gateOpen(s,i)&&Math.abs(c.x-x)<c.r+12){s.phase='lost';s.reason='gate';}}}
if(s.level===2){if(s.drag&&s.pointer){s.magnet.x=s.pointer.x;s.magnet.y=s.pointer.y;}const dx=s.magnet.x-c.x,dy=s.magnet.y-c.y,d=Math.hypot(dx,dy),f=d<190?Math.min(400,d*3.8):0;c.vx=(c.vx+(d?dx/d*f*dt:0))*Math.exp(-3*dt);c.vy=(c.vy+(d?dy/d*f*dt:0))*Math.exp(-3*dt);moveCargo(s,c.vx*dt,c.vy*dt);}
if(s.level===3){if(s.drag&&s.pointer){const tx=s.dragSide===1?s.pointer.x:W-s.pointer.x,dx=tx-c.x,dy=s.pointer.y-c.y,d=Math.hypot(dx,dy),move=Math.min(d,190*dt);if(d)mirrorMove(s,dx/d*move,dy/d*move);}if(overlaps(c,s.hazard)||overlaps(s.twin,s.hazard)){s.phase='lost';s.reason='scanner';}}
if(s.level>=4){c.vy=(c.vy+(s.watched?-190:160)*dt)*Math.exp(-1.5*dt);c.x+=75*dt;c.y+=c.vy*dt;if(c.y-c.r<83||c.y+c.r>505||s.walls.some(r=>overlaps(c,r))){s.phase='lost';s.reason='balloon-hit';}else if(c.x>870){s.phase='lost';s.reason='missed-desk';}}
if(s.level===5&&s.phase==='playing'){const lit=s.lights.some(l=>dist(l,c)<l.r);s.health=clamp(s.health+(lit?60:-38)*dt,0,100);if(s.health<=0){s.phase='lost';s.reason='dark-flight';}}
if(s.phase==='playing'&&dist(c,s.target)<s.target.r-9&&(s.level!==3||dist(s.twin,s.twinTarget)<s.twinTarget.r-9)){s.phase='won';s.delivered=1;s.drag=false;s.watched=false;}}
function step(s,dt){if(s.phase!=='playing'||!Number.isFinite(dt)||dt<=0)return;let time=Math.min(dt,.1);while(time>0&&s.phase==='playing'){const h=Math.min(time,1/120);tick(s,h);time-=h;}}
const api={create,begin,input,step,gateOpen,W,H,levels:6};root.OddCargo=api;if(typeof module==='object'&&module.exports)module.exports=api;
})(globalThis);
</script>

const titles=[['会怕黑的盆栽','The plant afraid of the dark'],['别盯着我的包裹','The parcel that hates being watched'],['走不直的磁铁箱','The magnetic crate'],['反着走的双胞胎','The mirror twins'],['想飞的气球包裹','The balloon parcel'],['夜航温室','The night greenhouse']];const directions=[['拖着盆栽走亮处，别让叶子枯萎。送到右上角收件台。','Drag the plant through pools of light. Keep it alive and reach the upper-right desk.'],['松开时它自己走，按住“盯住它”让它停。等闸门打开再放行。','It walks when unwatched. Hold “Watch it” to stop it. Release when the gates open.'],['拖动磁铁吸引铁箱，绕过两道隔板，送到右侧收件台。','Drag the magnet to pull the crate around both partitions to the receiving desk.'],['先拖动任一箱子，两箱会镜像移动。一起绕过隔板，避开红色扫描带，送到上方两台。','Drag either twin; the other mirrors it. Get both to the upper desks, avoiding partitions and the red scanner.'],['先按住充气让包裹上浮，松开就下降。借气流穿过两个高低窗口，送到右侧。','Hold to inflate and rise; release to descend. Ride the breeze through both windows to the right desk.'],['把盆栽活着送到右侧：先按住充气升向高处灯池，松开下降。光照恢复叶片活力。','Deliver the plant alive: first hold to rise toward the high light pool; release to descend. Light restores leaf energy.']];
