<script id="local-progress">
/* Local-only progress. No account, network, analytics, or access to other game saves. */
(function(root){'use strict';
 const KEY='three-worlds.progress.v1',GAMES=['world','cargo','bodies'];let memory={version:1,games:{}},persisted=true;
 function clean(raw){const out={version:1,games:{}};if(!raw||raw.version!==1||typeof raw.games!=='object'||!raw.games)return out;for(const game of GAMES){const source=raw.games[game];if(!source||typeof source!=='object')continue;const levels={};for(const [id,v] of Object.entries(source)){if(!/^\d+$/.test(id)||+id>99||!v||v.done!==true)continue;const item={done:true};for(const key of ['moves','seconds'])if(Number.isFinite(v[key])&&v[key]>=0)item[key]=v[key];levels[id]=item;}out.games[game]=levels;}return out;}
 function read(){try{const value=root.localStorage?.getItem(KEY);if(value){const stored=clean(JSON.parse(value));for(const game of GAMES){const levels=memory.games[game]||(memory.games[game]={});for(const [id,item]of Object.entries(stored.games[game]||{})){const current=levels[id]||{},merged={...item,...current,done:true};for(const key of ['moves','seconds'])if(Number.isFinite(item[key])&&Number.isFinite(current[key]))merged[key]=Math.min(item[key],current[key]);levels[id]=merged;}}}}catch(_){persisted=false;}return clean(memory);}
 function complete(game,level,result={}){if(!GAMES.includes(game)||!Number.isInteger(level)||level<0||level>99)return false;memory=read();const levels=memory.games[game]||(memory.games[game]={});const prev=levels[level]||{},next={...prev,done:true};for(const key of ['moves','seconds'])if(Number.isFinite(result[key])&&result[key]>=0)next[key]=Number.isFinite(prev[key])?Math.min(prev[key],result[key]):result[key];if(JSON.stringify(prev)===JSON.stringify(next))return true;levels[level]=next;try{if(!root.localStorage)throw Error('Storage unavailable');root.localStorage.setItem(KEY,JSON.stringify(memory));persisted=true;}catch(_){persisted=false;}return true;}
 function status(){return {progress:read(),persisted};}
 root.TrialProgress={complete,status,key:KEY};if(typeof module==='object'&&module.exports)module.exports=root.TrialProgress;
})(globalThis);

function render(){if(s.won)globalThis.TrialProgress?.complete('world',s.level,{moves:s.moves});document.documentElement.lang=lang;document.title=t('世界坏掉了','World Out of Order');$('back-gallery').textContent=t('← 返回三选一','← Back to gallery');$('levels').setAttribute('aria-label',t('选择关卡','Choose a level'));$('direction-controls').setAttribute('aria-label',t('重力方向','Gravity direction'));canvas.setAttribute('aria-label',t('规则谜题画板：绿色能量、金色出口与可移动机器人','Rule puzzle board: green energy, gold exit and movable robot'));$('title').textContent=t('世界坏掉了','World Out of Order');$('tagline').textContent=t('不是改变路线，而是改写路线的规则。','Change the rules that decide your route.');$('language').textContent=t('EN','中文');document.querySelectorAll('[data-dir]').forEach(b=>b.setAttribute('aria-label',({up:['向上','Up'],down:['向下','Down'],left:['向左','Left'],right:['向右','Right']})[b.dataset.dir][zh()?0:1]));$('name').textContent=E.levels[s.level].name[zh()?0:1];$('objective').textContent=t('收集绿晶体，然后停在金色出口。经过出口但没有停下不算完成。','Collect the green crystal, then stop at the gold exit. Passing the exit is not enough.');if(s.level===3)$('objective').textContent=t('收集能量后停在出口。液态能穿墙，固态也能成为停靠支点。','Collect energy, then stop at the exit. Liquid lets you pass; solid can give you a stopping point.');if(s.level>=4)$('objective').textContent=s.stage<2?t('先接通①，再接通②：高摩擦时停在当前编号上。','Connect ①, then ②: stop on the current number with high friction.'):t('两站已接通：回到金色出口。','Both nodes connected: return to the gold exit.');$('level-label').textContent=`${s.level+1} / ${E.levels.length} · `+t('规则试验','rule experiment');$('counter').textContent=t('操作 ','Actions ')+s.moves;$('rule').textContent=s.level===0?t('重力：每次按方向，滑到障碍前才停下。','Gravity: each direction slides you until an obstacle stops you.'):E.levels[s.level].rule==='phase'?t('蓝色隔板：'+(s.fluid?'液态，可穿过。':'固态，会挡路。'),'Blue panel: '+(s.fluid?'liquid, pass through.':'solid, blocks movement.')):t('摩擦：'+(s.grip?'高，每次移动一格。':'低，一直滑到墙边。'),'Friction: '+(s.grip?'high, move one tile at a time.':'low, ','The next room changes a different rule.');$('next').textContent=s.level===E.levels.length-1?t('回到第一关','Back to level one'):t('进入下一关','Next level');$('replay').textContent=t('重玩这一关','Replay this level');$('help-title').textContent=t('怎么操作 / 没有倒计时','How to play / no timer');$('help').textContent=t('点四个方向改变重力。机器人沿网格移动，每次撞到墙才停；高摩擦时只走一格。蓝色隔板可切换固液。绿色能量经过就收集，出口必须停住。可随时重置或撤回；切换关卡不保留本关进度。','Tap a direction to change gravity. The robot moves along the grid until a wall stops it; high friction limits movement to one tile. Toggle the blue panel between solid and liquid. Passing through energy collects it; you must stop at the exit. Reset or undo at any time. Changing levels discards the current attempt.');if(s.level>=4)$('help').textContent=t('依次接通①和②：必须打开摩擦并停在当前编号上，经过或顺序错误不会接通。紫色断桥会挡住高摩擦移动，关闭摩擦才能滑过。两站接通后，回到金色出口。所有操作都可以撤回，没有倒计时。','Connect ① then ② by stopping on each with friction enabled. Passing over a node or visiting out of order does not connect it. The purple gap blocks high-friction moves; remove friction to slide across. Once both are connected, return to the gold exit. Every action can be undone; there is no timer.');if(s.level===5)$('help').textContent+=t(' 本关另有固液开关：穿越前要液化，结束前要恢复固态。两个开关独立。',' This room also has a separate phase switch: liquefy before crossing and restore solid before finishing. The two switches are independent.');$('footer').textContent=t('关卡重新开始，完成记录本地保存 · R 重置，Z 撤回','Levels restart; completion records are saved locally · R reset, Z undo');$('levels').innerHTML=E.levels.map((l,i)=>`<button data-level="${i}" aria-pressed="${i===s.level}">${i+1} · ${zh()?['重力','固液','摩擦','墙与刹车','接力','终章'][i]:['Gravity','Phase','Friction','Wall brake','Relay','Finale'][i]}</button>`).join('');$('levels').querySelectorAll('button').forEach(b=>b.onclick=()=>load(Number(b.dataset.level)));}
function load(i){s=E.create(i);animation=null;hintLevel=0;$('hints').open=false;render();}
function command(c){if(animation)return;const old={...s.player};const moved=E.act(s,c);if(moved&&s.trail.length){animation={points:[old,...s.trail],start:performance.now(),duration:Math.min(950,s.trail.length*95)};}render();}
function draw(now){const unit=80;ctx.clearRect(0,0,800,640);ctx.fillStyle='#0a1425';ctx.fillRect(0,0,800,640);for(let y=0;y<8;y++)for(let x=0;x<10;x++){const c=s.cells[y][x],px=x*unit,py=y*unit;ctx.strokeStyle='#1a2c43';ctx.strokeRect(px+1,py+1,78,78);if(c==='#'){ctx.fillStyle='#21334b';ctx.fillRect(px+4,py+4,72,72);ctx.fillStyle='#344e6b';ctx.fillRect(px+4,py+4,72,7);ctx.strokeStyle='#14243a';ctx.beginPath();ctx.moveTo(px+12,py+64);ctx.lineTo(px+62,py+12);ctx.stroke();}if(c==='='){ctx.fillStyle='#a577ef33';ctx.fillRect(px+3,py+3,74,74);ctx.strokeStyle='#d2a9ff';ctx.setLineDash([5,7]);ctx.strokeRect(px+10,py+10,60,60);ctx.setLineDash([]);ctx.fillStyle='#dcc4ff';ctx.font='23px system-ui';ctx.textAlign='center';ctx.fillText('⇆',px+40,py+48);}if(c==='~'){ctx.fillStyle=s.fluid?'#218caa55':'#347da8';ctx.fillRect(px+7,py+7,66,66);ctx.strokeStyle='#82d5ff';for(let j=0;j<4;j++){ctx.beginPath();ctx.moveTo(px+10,py+15+j*15);ctx.quadraticCurveTo(px+40,py+5+j*15+(s.fluid?Math.sin(now/400+j)*8:0),px+70,py+15+j*15);ctx.stroke();}}}
const exit=s.exit;ctx.shadowColor='#ffce79';ctx.shadowBlur=s.collected?22:5;ctx.strokeStyle=s.collected?'#ffdc94':'#7e6b4f';ctx.lineWidth=5;ctx.strokeRect(exit.x*unit+18,exit.y*unit+13,44,57);ctx.shadowBlur=0;ctx.fillStyle='#f5d79a';ctx.font='18px system-ui';ctx.textAlign='center';ctx.fillText('↗',exit.x*unit+40,exit.y*unit+49);if(s.level<4&&!s.collected){const gx=s.gem.x*unit+40,gy=s.gem.y*unit+40;ctx.fillStyle='#69f3bd';ctx.shadowColor='#69f3bd';ctx.shadowBlur=20;ctx.beginPath();ctx.moveTo(gx,gy-20);ctx.lineTo(gx+15,gy);ctx.lineTo(gx,gy+20);ctx.lineTo(gx-15,gy);ctx.closePath();ctx.fill();ctx.shadowBlur=0;}if(s.level>=4){[s.gem,s.second].forEach((node,i)=>{const nx=node.x*unit+40,ny=node.y*unit+40;ctx.fillStyle=s.stage>i?'#59cca3':s.stage===i?'#b8f5d9':'#5c647d';ctx.beginPath();ctx.arc(nx,ny,23,0,Math.PI*2);ctx.fill();ctx.fillStyle='#10273a';ctx.font='bold 25px system-ui';ctx.textAlign='center';ctx.fillText(String(i+1),nx,ny+9);});}let p=s.player;if(animation){const f=Math.min(1,(now-animation.start)/animation.duration),path=animation.points,n=f*(path.length-1),i=Math.min(path.length-2,Math.floor(n)),r=n-i;p={x:path[i].x+(path[i+1].x-path[i].x)*r,y:path[i].y+(path[i+1].y-path[i].y)*r};if(f>=1){animation=null;render();}}const px=p.x*unit+40,py=p.y*unit+40;ctx.shadowColor='#99c8ff';ctx.shadowBlur=18;ctx.fillStyle='#e2f2ff';ctx.fillRect(px-19,py-22,38,40);ctx.shadowBlur=0;ctx.fillStyle='#243a61';ctx.fillRect(px-13,py-13,26,12);ctx.fillStyle='#7af2d1';ctx.fillRect(px-9,py-10,6,5);ctx.fillRect(px+3,py-10,6,5);ctx.strokeStyle='#daeaff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px,py-22);ctx.lineTo(px,py-30);ctx.stroke();ctx.fillStyle=s.grip?'#f4b978':'#81cefa';ctx.fillRect(px-14,py+18,9,7);ctx.fillRect(px+5,py+18,9,7);ctx.strokeStyle='#61a3cc66';ctx.lineWidth=2;ctx.beginPath();s.trail.forEach((v,i)=>i?ctx.lineTo(v.x*unit+40,v.y*unit+40):ctx.moveTo(v.x*unit+40,v.y*unit+40));ctx.stroke();requestAnimationFrame(draw);}
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>command(b.dataset.dir));$('power').onclick=()=>command('power');$('phase-power').onclick=()=>command('phase');$('hint-next').onclick=()=>{hintLevel=Math.min(3,hintLevel+1);render();};$('undo').onclick=()=>{animation=null;command('undo');};$('reset').onclick=()=>load(s.level);$('replay').onclick=()=>load(s.level);$('next').onclick=()=>load((s.level+1)%E.levels.length);$('language').onclick=()=>{lang=zh()?'en':'zh';render();};window.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;const key=e.key.toLowerCase(),map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right',' ':'power',f:'phase',z:'undo'};if(key==='r'){e.preventDefault();load(s.level);}else if(map[key]){e.preventDefault();if(key==='z')animation=null;command(map[key]);}});render();requestAnimationFrame(draw);
})();
